quarkus.http.port=8083
%test.quarkus.http.test-port=8092

# MySQL
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=${LOANS_DB_USERNAME:loans_user}
quarkus.datasource.password=${LOANS_DB_PASSWORD:loans_pass}
quarkus.datasource.reactive.url=mysql://${DB_HOST:localhost}:${DB_PORT:3307}/loans_db?createDatabaseIfNotExist=true

quarkus.hibernate-orm.log.sql=true

# Hibernate Reactive
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# Secondary reactive datasource for the loan database backup.
quarkus.datasource."loans-backup".db-kind=mysql
quarkus.datasource."loans-backup".username=${LOANS_DB_USERNAME:loans_user}
quarkus.datasource."loans-backup".password=${LOANS_DB_PASSWORD:loans_pass}
quarkus.datasource."loans-backup".reactive.url=mysql://${DB_BACKUP_HOST:localhost}:${DB_BACKUP_PORT:3305}/loans_db_bk?createDatabaseIfNotExist=true

# QA database configuration. Set the URL and credentials through the deployment environment.
%qa.quarkus.datasource.reactive.url=${LOANS_DB_QA_URL}
%qa.quarkus.datasource.username=${LOANS_DB_QA_USERNAME}
%qa.quarkus.datasource.password=${LOANS_DB_QA_PASSWORD}
%qa.quarkus.datasource."loans-backup".reactive.url=${LOANS_DB_BK_QA_URL}
%qa.quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# Book Availability Checker API
quarkus.rest-client.book-availability-checker-api.url=http://localhost:8082

# Habilitar exportación de métricas de Micrometer a Prometheus
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.enabled=true

# JWT signing keys are supplied only in production as a valid URI, for example:
# JWT_SIGN_KEY_LOCATION=file:///C:/secrets/privateKey.pem
mp.jwt.verify.issuer=${JWT_ISSUER:jwt-service}

%prod.smallrye.jwt.sign.key.location=${JWT_SIGN_KEY_LOCATION}
%prod.mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION}

# Permitir acceso público y libre a todas las rutas bajo /q/ (Dev UI, Swagger UI, métricas, etc.)
quarkus.http.auth.permission.dev-ui.paths=/q/*
quarkus.http.auth.permission.dev-ui.policy=permit

# ==============================================================================
# CONFIGURACIÓN GLOBAL DE KAFKA
# ==============================================================================
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

# ==============================================================================
# CANAL DE SALIDA (Productor - Outgoing)
# ==============================================================================
# Mapea el canal interno 'audit-topic' hacia el tópico dinámico de la plantilla
mp.messaging.outgoing.audit-topic.connector=smallrye-kafka
mp.messaging.outgoing.audit-topic.topic=${app.kafka-config.audit-topic:audit-topic}
mp.messaging.outgoing.audit-topic.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
# Optimización de rendimiento para el productor reactivo
mp.messaging.outgoing.audit-topic.acks=1