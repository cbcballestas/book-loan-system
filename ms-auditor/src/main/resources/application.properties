# MongoDB
quarkus.mongodb.connection-string=mongodb://localhost:27018
quarkus.mongodb.database=audit_log_db

# ----------------------------------------------------
# Messaging Kafka - Serialización/Deserialización Jackson
# ----------------------------------------------------

# Configuración de Kafka
kafka.bootstrap.servers=localhost:29092

# Canal Entrante (Consumidor)
mp.messaging.incoming.audit-topic.connector=smallrye-kafka
mp.messaging.incoming.audit-topic.topic=${app.kafka-config.audit-topic:audit-topic}
mp.messaging.incoming.audit-topic.value.deserializer=com.cballestas.serialization.AuditEventDeserializer
mp.messaging.incoming.audit-topic.auto.offset.reset=earliest
